name: ci

on: [push, pull_request]

jobs:
  check:
    # Sin SOLIDWORKS en CI: se comprueba que todo compila, que el paquete se
    # instala y que el servidor arranca y publica sus herramientas.
    runs-on: windows-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m compileall -q src tools scripts
      - run: python -m solidworks_mcp --probe
